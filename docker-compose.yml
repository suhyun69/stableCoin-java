# 로컬 개발용 인프라: Postgres + 로컬 이더리움 노드(anvil) + Kafka
#   docker compose up -d     실행
#   docker compose ps        상태 확인 (healthy 여부)
#   docker compose down      종료 (Postgres 데이터는 볼륨에 남음)
#   docker compose down -v   종료 + Postgres 데이터 삭제
#
# 포트와 접속 정보는 환경 변수로 바꿀 수 있다. 예) ANVIL_PORT=8546 docker compose up -d
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stablecoin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stablecoin}
      POSTGRES_DB: ${POSTGRES_DB:-stablecoin}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  anvil:
    # 로컬에 설치한 anvil(./anvil/install.sh)과 같은 버전
    image: ghcr.io/foundry-rs/foundry:v1.8.7
    # 이미지 entrypoint가 /bin/sh -c 이므로 명령 전체를 원소 하나짜리 리스트로 넘긴다.
    # (문자열로 쓰면 compose가 단어별로 나눠서 sh -c 에는 "anvil"만 전달되고 옵션이 무시된다)
    # 컨테이너 밖에서 접속할 수 있도록 0.0.0.0 에 바인딩한다. 상태는 메모리에만 있어 재시작하면 초기화된다.
    command: [ "anvil --host 0.0.0.0 --port 8545 --chain-id ${CHAIN_ID:-31337}" ]
    ports:
      - "${ANVIL_PORT:-8545}:8545"
    healthcheck:
      test: [ "CMD-SHELL", "cast chain-id --rpc-url http://127.0.0.1:8545" ]
      interval: 2s
      timeout: 3s
      retries: 20

  kafka:
    # 단일 노드 KRaft 모드 (ZooKeeper 없이 broker와 controller를 한 프로세스에서 실행)
    image: apache/kafka:4.1.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # PLAINTEXT: 호스트(앱)용, INTERNAL: compose 네트워크 안의 컨테이너와 kafka CLI용 (kafka:29092)
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      # 접속한 리스너에 따라 돌려주는 주소. 호스트 포트를 바꾸면 PLAINTEXT 주소도 같이 바뀐다.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:${KAFKA_PORT:-9092},INTERNAL://kafka:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # 단일 노드라 내부 토픽의 복제본은 1개
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 > /dev/null" ]
      interval: 5s
      timeout: 10s
      retries: 20
    # 데이터는 컨테이너 안에만 둔다 (down 하면 토픽과 메시지가 지워진다)

volumes:
  postgres-data:
