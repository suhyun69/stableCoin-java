name: stablepay
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stablepay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stablepay}
      POSTGRES_DB: ${POSTGRES_DB:-stablepay}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 3s
      retries: 20
  anvil:
    image: ghcr.io/foundry-rs/foundry:v1.7.0
    entrypoint: [anvil]
    command: [--host, 0.0.0.0, --chain-id, '31337', --block-time, '2', --state, /data/state.json, --state-interval, '1', --preserve-historical-states]
    ports:
      - "127.0.0.1:${ANVIL_PORT:-8545}:8545"
    volumes:
      - anvil-data:/data
    stop_grace_period: 30s
    healthcheck:
      test: [CMD, cast, chain-id, --rpc-url, 'http://127.0.0.1:8545']
      interval: 3s
      timeout: 3s
      retries: 20
  kafka:
    image: apache/kafka:4.1.2
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: [CMD, /opt/kafka/bin/kafka-topics.sh, --bootstrap-server, 'localhost:19092', --list]
      interval: 5s
      timeout: 10s
      retries: 20
volumes:
  postgres-data:
  anvil-data:
  kafka-data:
