spring.application.name=stablecoin

# 노드가 응답하지 않을 때 요청이 붙잡히지 않도록 HTTP 클라이언트(RestClient) timeout 설정
spring.http.clients.connect-timeout=1s
spring.http.clients.read-timeout=3s

# /actuator/health 에 각 구성요소(chain 등) 상태를 함께 보여줌
management.endpoint.health.show-details=always
# Actuator 엔드포인트(health)를 OpenAPI 문서와 Swagger UI에 포함
springdoc.show-actuator=true

chain.rpc-url=${CHAIN_RPC_URL:http://127.0.0.1:8545}
# 서명에 포함하는 체인 ID. 앱 시작 시 노드의 체인 ID와 같은지 확인한다.
chain.id=${CHAIN_ID:31337}
# 전송 후 트랜잭션 영수증을 기다리는 최대 시간
chain.receipt-timeout=2s

# anvil 기본 지갑. anvil과 같은 니모닉에서 앱 시작 시 키를 계산하므로 개인키를 따로 설정하지 않는다.
# 누구나 아는 공개 니모닉이라 chain.id 31337(로컬)에서만 허용된다. anvil --mnemonic 으로 바꿨다면 같이 바꾼다.
chain.dev-wallets.mnemonic=${CHAIN_DEV_WALLETS_MNEMONIC:test test test test test test test test test test test junk}
# 계산할 지갑 수 (anvil 기본값 10)
chain.dev-wallets.count=${CHAIN_DEV_WALLETS_COUNT:10}
