spring.application.name=stablecoin

# 노드가 응답하지 않을 때 요청이 붙잡히지 않도록 HTTP 클라이언트(RestClient) timeout 설정
spring.http.clients.connect-timeout=1s
spring.http.clients.read-timeout=3s

# /actuator/health 에 각 구성요소(chain 등) 상태를 함께 보여줌
management.endpoint.health.show-details=always
# Actuator 엔드포인트(health)를 OpenAPI 문서와 Swagger UI에 포함
springdoc.show-actuator=true

chain.rpc-url=${CHAIN_RPC_URL:http://127.0.0.1:8545}
# 서명에 포함하는 체인 ID. 앱 시작 시 노드의 체인 ID와 같은지 확인한다.
chain.id=${CHAIN_ID:31337}
# 전송 후 트랜잭션 영수증을 기다리는 최대 시간
chain.receipt-timeout=2s

# anvil 기본 지갑. anvil과 같은 니모닉에서 앱 시작 시 키를 계산하므로 개인키를 따로 설정하지 않는다.
# 누구나 아는 공개 니모닉이라 chain.id 31337(로컬)에서만 허용된다. anvil --mnemonic 으로 바꿨다면 같이 바꾼다.
chain.dev-wallets.mnemonic=${CHAIN_DEV_WALLETS_MNEMONIC:test test test test test test test test test test test junk}
# 계산할 지갑 수 (anvil 기본값 10)
chain.dev-wallets.count=${CHAIN_DEV_WALLETS_COUNT:10}
# 지급(POST /api/payouts)을 보내는 회사 지갑. 위 지갑 중 하나여야 한다 (기본: anvil 0번 지갑).
chain.payout-wallet=${CHAIN_PAYOUT_WALLET:0xf39fd6e51aad88f6f4ce6ab8827279cfffb92266}

# DB (docker compose의 postgres). 스키마는 Flyway(db/migration)로 만들고 JPA는 검증만 한다.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/stablecoin}
spring.datasource.username=${DATABASE_USERNAME:stablecoin}
spring.datasource.password=${DATABASE_PASSWORD:stablecoin}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Kafka (docker compose의 kafka). 노드가 꺼져 있을 때 오래 붙잡히지 않도록 timeout을 짧게 둔다.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=10000
spring.kafka.admin.operation-timeout=5s
spring.kafka.admin.properties.request.timeout.ms=5000
spring.kafka.admin.properties.default.api.timeout.ms=5000

# outbox 발행기: PENDING 메시지를 잡아(SKIP LOCKED, 임대) Kafka에 발행하고 PUBLISHED로 바꾼다.
outbox.publisher.enabled=${OUTBOX_PUBLISHER_ENABLED:true}
# 발행 주기와 한 번에 잡는 메시지 수
outbox.publisher.interval=1s
outbox.publisher.batch-size=20
# 잡은 뒤 이 시간 안에 끝내지 못하면(워커가 죽는 등) 다른 워커가 다시 잡을 수 있다
outbox.publisher.lease=30s
# 발행 실패 시 다시 시도하기까지 대기: 1s, 2s, 4s ... 최대 5m. max-attempts 번 실패하면 FAILED
outbox.publisher.initial-backoff=1s
outbox.publisher.max-backoff=5m
outbox.publisher.max-attempts=10
# 토픽 이름 = topic-prefix + aggregate_type 소문자 (예: stablecoin.payout)
outbox.kafka.topic-prefix=stablecoin.
