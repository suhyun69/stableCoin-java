server:
  port: 8080

spring:
  task:
    scheduling:
      pool:
        size: 3
  application:
    name: stablepay-api

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/stablepay}
    username: ${DATABASE_USERNAME:stablepay}
    password: ${DATABASE_PASSWORD:stablepay}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 15000
        request.timeout.ms: 5000
        max.block.ms: 5000
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        max.poll.records: 10
        max.poll.interval.ms: 300000
    listener:
      ack-mode: record
  flyway:
    enabled: true

# http://localhost:8080/swagger-ui.html 에서 API를 보고 직접 호출해 볼 수 있다.
# 스펙 원본(JSON)은 http://localhost:8080/v3/api-docs
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

logging:
  level:
    root: INFO
    com.example.demo: DEBUG


stablepay:
  workers:
    enabled: ${WORKERS_ENABLED:true}
  chain:
    enabled: ${CHAIN_ENABLED:true}
    rpc-url: ${ANVIL_RPC_URL:http://localhost:8545}
    id: ${CHAIN_ID:31337}
    # Public Anvil development key, never a production wallet.
    private-keys: ${ANVIL_PRIVATE_KEYS:0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80,0x59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d,0x5de4111afa1a4b94908f83103eb1f1706367c2e68ca870fc3fb9a804cdab365a,0x7c852118294e51e653712a81e05800f419141751be58f605c371e15141b007a6,0x47e179ec197488593b187f80a00eb0da91f1b9d0b13f8733639f19c30a34926a,0x8b3a350cf5c34c9194ca85829a2df0ec3153be0318b5e2d3348e872092edffba,0x92db14e403b83dfe3df233f83dfa3a0d7096f21ca9b0d6d6b8d88b2b4ec1564e,0x4bbbf85ce3377467afe5d46f804f221813b2bb87f24d81f60f1fcdbf7cbf4356,0xdbda1821b80551c9d65939329250298aa3472ba22feea921c0cf5d620ea67b97,0x2a871d0798f97d79848a013d4936a73bf4cc922c825d33c1cf7073dff6d409c6}
    confirmations: ${REQUIRED_CONFIRMATIONS:2}
  messaging:
    enabled: ${MESSAGING_ENABLED:true}
    topic: ${PAYOUT_TOPIC:stablepay.payout-requested.v1}
    group: ${PAYOUT_GROUP:stablepay-payout-sender}
    partitions: 1
