server:
  port: 8080

spring:
  application:
    name: demo

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/stablepay}
    username: ${DATABASE_USERNAME:stablepay}
    password: ${DATABASE_PASSWORD:stablepay}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

# http://localhost:8080/swagger-ui.html 에서 API를 보고 직접 호출해 볼 수 있다.
# 스펙 원본(JSON)은 http://localhost:8080/v3/api-docs
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

logging:
  level:
    root: INFO
    com.example.demo: DEBUG
    org.hibernate.SQL: DEBUG
