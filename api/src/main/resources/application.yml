server:
  port: 8080

spring:
  task:
    scheduling:
      pool:
        size: 3
  application:
    name: stablepay-api

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/stablepay}
    username: ${DATABASE_USERNAME:stablepay}
    password: ${DATABASE_PASSWORD:stablepay}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 15000
        request.timeout.ms: 5000
        max.block.ms: 5000
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        max.poll.records: 10
        max.poll.interval.ms: 300000
    listener:
      ack-mode: record
  flyway:
    enabled: true

# http://localhost:8080/swagger-ui.html 에서 API를 보고 직접 호출해 볼 수 있다.
# 스펙 원본(JSON)은 http://localhost:8080/v3/api-docs
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

logging:
  level:
    root: INFO
    com.example.demo: DEBUG


stablepay:
  workers:
    enabled: ${WORKERS_ENABLED:true}
  chain:
    enabled: ${CHAIN_ENABLED:true}
    rpc-url: ${ANVIL_RPC_URL:http://localhost:8545}
    id: ${CHAIN_ID:31337}
    sender-address: ${SENDER_ADDRESS:0xf39fd6e51aad88f6f4ce6ab8827279cfffb92266}
    # Public Anvil development key, never a production wallet.
    private-key: ${ANVIL_PRIVATE_KEY:0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80}
    confirmations: ${REQUIRED_CONFIRMATIONS:2}
  messaging:
    enabled: ${MESSAGING_ENABLED:true}
    topic: ${PAYOUT_TOPIC:stablepay.payout-requested.v1}
    group: ${PAYOUT_GROUP:stablepay-payout-sender}
    partitions: 1
