# 테스트는 운영/개발용 파일 DB를 건드리지 않도록 인메모리 H2를 쓴다.
spring:
  datasource:
    url: jdbc:h2:mem:demo-test;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

  h2:
    console:
      enabled: false

logging:
  level:
    org.hibernate.SQL: INFO
